<body>
    <a href="../index.html">home</a>
    <h1>fanqiechaodan</h1>
    <img src="../images/fanqiechaodan.png" alt="fanqiechaodan">
    <h2>描述</h2>
    <p>经典中餐</p>
    <h2>配料</h2>
    <ul>
        <li>鸡蛋</li>
        <li>番茄</li>
        <li>葱</li>
    </ul>
    <h2>步骤</h2>
    <ol>
        <li>鸡蛋打匀，热油下锅</li>
        <li>炒熟打散盛出</li>
        <li>洗锅，入油，下切成块的西红柿</li>
        <li>稍微炒一下后盖上锅盖焖煮出水</li>
        <li>加入准备好的炒蛋炒匀</li>
        <li>加盐撒上葱花出锅</li>
    </ol>
</body>
