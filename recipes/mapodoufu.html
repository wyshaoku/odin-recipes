<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapo Doufu</title>
</head>
<body>
    <a href="../index.html">home</a>
    <h1>Mapo Doufu</h1>
    <img src="../images/mapodoufu.png" alt="mapodoufu">
    <h2>描述</h2>
    <p>经典川菜</p>
    <h2>配料</h2>
    <ul>
        <li>豆腐</li>
        <li>肉末</li>
        <li>蒜</li>
        <li>葱花</li>
        <li>小米椒</li>
        <li>豆瓣酱</li>
    </ul>
    <h2>步骤</h2>
    <ol>
        <li>酱油、盐，腌制肉末</li>
        <li>豆腐灼水盛出</li>
        <li>油爆香蒜末辣椒碎，加入肉末炒至焦香</li>
        <li>倒入豆腐加水，盐，酱油焖煮</li>
        <li>焖煮至水半干时加入豆瓣酱，搅拌均匀</li>
        <li>大火收汁，撒上葱花，出锅</li>
    </ol>
</body>
</html>
