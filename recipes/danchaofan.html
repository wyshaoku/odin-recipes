    <title>danchaofan</title>

<body>
    <a href="../index.html">home</a>
    <h1>danchaofan</h1>
    <img src="../images/danchaofan.png" alt="danchaofan">
    <h2>描述</h2>
    <p>经典中餐</p>
    <h2>配料</h2>
    <ul>
        <li>鸡蛋</li>
        <li>米饭</li>
        <li>葱花</li>
        <li>酱油</li>
        <li>盐</li>
    </ul>
    <h2>步骤</h2>
    <ol>
        <li>鸡蛋搅匀淋入米饭搅匀</li>
        <li>油下锅，将制备好的米饭下锅炒</li>
        <li>加入酱油和盐，炒出香气后盛出</li>
        <li>鸡蛋打匀，热油下锅</li>
        <li>炒熟打碎后加入炒好的米饭，加盐</li>
        <li>撒上葱花，出锅</li>
    </ol>
</body>
</html>
